buildscript {
  repositories { mavenCentral() }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.nativelayout'
version = '1.0.0'

android {
  namespace 'expo.modules.nativelayout'
  buildFeatures { compose true }
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation project(':expo-ui')
  implementation project(':react-native-screens')
  implementation 'com.github.Dimezis:BlurView:version-3.1.0'
  implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
  implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
  implementation 'androidx.compose.foundation:foundation-android:1.10.6'
  implementation 'androidx.compose.ui:ui-android:1.10.6'
  implementation 'com.google.android.material:material:1.13.0'
}
