name: Mirror release to CNB

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published installer release to mirror (v0.2.0 or v0.2.0-beta.1)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cnb-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Upload installers and link CNB downloads
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Mirror published installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node .github/scripts/cnb-release.cjs
  ios-sources:
    name: Update CNB AltStore and LiveContainer sources
    needs: mirror
    runs-on: ubuntu-latest
    concurrency:
      group: ios-app-sources-cnb
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Publish CNB sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
        run: node .github/scripts/ios-sources-cnb.cjs
      - name: Verify anonymous app update checks
        run: bun --use-system-ca .github/scripts/verify-cnb-updates.ts
