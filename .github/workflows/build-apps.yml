name: Build Apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (android/ios/both)'
        required: true
        default: 'both'
        type: choice
        options:
          - android
          - ios
          - both
      android_profile:
        description: 'Android build profile (development/preview/production)'
        required: false
        default: 'production'
        type: choice
        options:
          - development
          - preview
          - production
      ios_build_type:
        description: 'iOS build type (release/development)'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - development
  workflow_call:
    inputs:
      ref:
        description: 'Exact commit to build'
        required: false
        default: ''
        type: string
      platform:
        required: false
        default: 'both'
        type: string
      android_profile:
        required: false
        default: 'production'
        type: string
      ios_build_type:
        required: false
        default: 'release'
        type: string
      build_suffix:
        required: false
        default: ''
        type: string
      release_tag:
        description: 'Full release tag embedded in both apps'
        required: false
        default: ''
        type: string
      ios_runtime:
        required: false
        default: ''
        type: string
      ios_build_number:
        required: false
        default: ''
        type: string
      android_runtime:
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    env:
      NEKOFIN_IOS_BUILD_NUMBER: ${{ inputs.ios_build_number || '' }}
      EXPO_PUBLIC_DANDANPLAY_API_URL: ${{ secrets.EXPO_PUBLIC_DANDANPLAY_API_URL }}
      NEKOFIN_RELEASE_TAG: ${{ inputs.release_tag || '' }}
      NEKOFIN_OTA_URL: ${{ vars.NEKOFIN_OTA_URL }}
      NEKOFIN_NATIVE_RUNTIME: ${{ inputs.android_runtime || '' }}
      EXPO_UPDATES_WORKFLOW_OVERRIDE: managed
      ANDROID_NDK_VERSION: 27.1.12297006

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set app version from release tag
        if: env.NEKOFIN_RELEASE_TAG != ''
        run: node .github/scripts/release-metadata.cjs "$NEKOFIN_RELEASE_TAG" --write-version

      - name: Free Android runner disk space
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune --all --force || true
          echo "Disk after cleanup:"
          df -h

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager_path="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          ndk_path="${sdk_root}/ndk/${ANDROID_NDK_VERSION}"

          if [[ ! -x "${sdkmanager_path}" ]]; then
            echo "sdkmanager was not found at ${sdkmanager_path}."
            exit 1
          fi

          if [[ -f "${ndk_path}/source.properties" ]]; then
            echo "Android NDK ${ANDROID_NDK_VERSION} is already installed."
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Installing Android NDK ${ANDROID_NDK_VERSION} (attempt ${attempt}/3)..."
            rm -rf "${ndk_path}" "${sdk_root}/.temp"

            if "${sdkmanager_path}" --install "ndk;${ANDROID_NDK_VERSION}" && \
              [[ -f "${ndk_path}/source.properties" ]]; then
              echo "Android NDK ${ANDROID_NDK_VERSION} installed successfully."
              exit 0
            fi

            sleep $((attempt * 5))
          done

          echo "Failed to install Android NDK ${ANDROID_NDK_VERSION} after 3 attempts."
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run smoke tests
        run: bun run test:smoke

      - name: Cache EAS build
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-*
            ~/.gradle/wrapper
            .expo
          key: ${{ runner.os }}-eas-android-${{ hashFiles('**/eas.json', '**/app.config.ts', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-eas-android-

      - name: Build Android
        env:
          BUILD_PROFILE: ${{ inputs.android_profile || 'production' }}
        run: eas build --local --platform android --profile "$BUILD_PROFILE" --output build-android.apk --non-interactive

      - name: Verify Android installer runtime
        if: env.NEKOFIN_NATIVE_RUNTIME != ''
        run: node .github/scripts/verify-native-runtime.cjs android build-android.apk "$NEKOFIN_NATIVE_RUNTIME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.android_profile || 'production' }}${{ inputs.build_suffix }}
          path: build-android.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS
    runs-on: macos-26
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    env:
      NEKOFIN_IOS_BUILD_NUMBER: ${{ inputs.ios_build_number || '' }}
      EXPO_PUBLIC_DANDANPLAY_API_URL: ${{ secrets.EXPO_PUBLIC_DANDANPLAY_API_URL }}
      NEKOFIN_RELEASE_TAG: ${{ inputs.release_tag || '' }}
      NEKOFIN_OTA_URL: ${{ vars.NEKOFIN_OTA_URL }}
      NEKOFIN_NATIVE_RUNTIME: ${{ inputs.ios_runtime || '' }}
      EXPO_UPDATES_WORKFLOW_OVERRIDE: managed
      APP_VARIANT: ${{ inputs.ios_build_type == 'development' && 'development' || 'production' }}
      BUILD_CONFIGURATION: ${{ inputs.ios_build_type == 'development' && 'Debug' || 'Release' }}
      IPA_NAME: nekofin-ios${{ inputs.ios_build_type == 'development' && '-dev' || '' }}${{ inputs.build_suffix }}.ipa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set app version from release tag
        if: env.NEKOFIN_RELEASE_TAG != ''
        run: node .github/scripts/release-metadata.cjs "$NEKOFIN_RELEASE_TAG" --write-version

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install Xcode platforms
        run: |
          xcrun simctl list > /dev/null # https://github.com/actions/runner-images/issues/12862#issuecomment-3239326872
          xcodebuild -downloadPlatform iOS

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run smoke tests
        run: bun run test:smoke

      - name: Run Expo Prebuild
        run: bunx expo prebuild -p ios --clean

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build Unsigned Archive
        run: |
          xcodebuild -workspace ios/nekofin.xcworkspace \
            -scheme nekofin \
            -configuration "$BUILD_CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath build/nekofin.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Verify iOS installer runtime
        if: env.NEKOFIN_NATIVE_RUNTIME != ''
        run: node .github/scripts/verify-native-runtime.cjs ios build/nekofin.xcarchive/Products/Applications/nekofin.app "$NEKOFIN_NATIVE_RUNTIME"

      - name: Package ipa
        run: |
          mkdir Payload
          cp -r build/nekofin.xcarchive/Products/Applications/nekofin.app Payload
          zip -r "$IPA_NAME" Payload

      - name: Extract AltStore and LiveContainer metadata from IPA
        if: env.NEKOFIN_RELEASE_TAG != ''
        run: python3 .github/scripts/ios-source-metadata.py "$IPA_NAME" "$NEKOFIN_RELEASE_TAG" "nekofin-${NEKOFIN_RELEASE_TAG}-ios-source.json" --entitlements ios/nekofin/nekofin.entitlements

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.ios_build_type || 'release' }}${{ inputs.build_suffix }}
          path: |
            ${{ env.IPA_NAME }}
            *-ios-source.json
          if-no-files-found: error
