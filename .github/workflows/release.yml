name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (v0.2.0 or v0.2.0-beta.1)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate version tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out version tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || format('refs/tags/{0}', inputs.tag) }}

      - name: Test release automation
        run: node --test .github/scripts/*.test.cjs

      - name: Validate tag against app version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node .github/scripts/release-metadata.cjs "$RELEASE_TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build release apps
    needs: prepare
    uses: ./.github/workflows/build-apps.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      platform: both
      android_profile: production
      ios_build_type: release
      build_suffix: -${{ needs.prepare.outputs.tag }}
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-production-${{ needs.prepare.outputs.tag }}
          path: artifacts/android

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-release-${{ needs.prepare.outputs.tag }}
          path: artifacts/ios

      - name: Prepare versioned assets and checksums
        run: |
          mkdir -p release
          cp artifacts/android/*.apk "release/nekofin-${RELEASE_TAG}-android-arm64.apk"
          cp artifacts/ios/*.ipa "release/nekofin-${RELEASE_TAG}-ios-unsigned.ipa"
          cd release
          sha256sum ./*.apk ./*.ipa > SHA256SUMS

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-release.sh
