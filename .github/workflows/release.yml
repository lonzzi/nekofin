name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (v0.2.0 or v0.2.0-beta.1)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate version tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.version.outputs.sha }}
      ios_runtime: ${{ steps.runtime.outputs.ios }}
      android_runtime: ${{ steps.runtime.outputs.android }}
    steps:
      - name: Check out version tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || format('refs/tags/{0}', inputs.tag) }}

      - name: Test release automation
        run: node --test .github/scripts/*.test.cjs

      - name: Set app version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node .github/scripts/release-metadata.cjs "$RELEASE_TAG" --write-version
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Resolve signed native runtime contracts
        id: runtime
        env:
          APP_VARIANT: production
          NEKOFIN_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          NEKOFIN_OTA_URL: ${{ vars.NEKOFIN_OTA_URL }}
          EXPO_PUBLIC_DANDANPLAY_API_URL: ${{ secrets.EXPO_PUBLIC_DANDANPLAY_API_URL }}
        run: |
          mkdir -p build
          node scripts/ota/runtime.mjs "build/nekofin-${NEKOFIN_RELEASE_TAG}-runtimes.json"
          node -e 'const fs=require("node:fs"); const m=JSON.parse(fs.readFileSync(`build/nekofin-${process.env.NEKOFIN_RELEASE_TAG}-runtimes.json`)); fs.appendFileSync(process.env.GITHUB_OUTPUT,`ios=${m.runtimes.ios}\nandroid=${m.runtimes.android}\n`);'
      - uses: actions/upload-artifact@v4
        with:
          name: native-runtimes-${{ steps.version.outputs.tag }}
          path: build/*-runtimes.json

  build:
    name: Build release apps
    needs: prepare
    uses: ./.github/workflows/build-apps.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      platform: both
      android_profile: production
      ios_build_type: release
      build_suffix: -${{ needs.prepare.outputs.tag }}
      release_tag: ${{ needs.prepare.outputs.tag }}
      ios_runtime: ${{ needs.prepare.outputs.ios_runtime }}
      android_runtime: ${{ needs.prepare.outputs.android_runtime }}
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-production-${{ needs.prepare.outputs.tag }}
          path: artifacts/android

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-release-${{ needs.prepare.outputs.tag }}
          path: artifacts/ios

      - name: Prepare versioned assets and checksums
        run: |
          mkdir -p release
          cp artifacts/android/*.apk "release/nekofin-${RELEASE_TAG}-android-arm64.apk"
          cp artifacts/ios/*.ipa "release/nekofin-${RELEASE_TAG}-ios-unsigned.ipa"

      - uses: actions/download-artifact@v4
        with:
          name: native-runtimes-${{ needs.prepare.outputs.tag }}
          path: release

      - name: Checksum installers and runtime contracts
        run: |
          cd release
          sha256sum ./*.apk ./*.ipa ./*-runtimes.json > SHA256SUMS

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-release.sh

  sync-version:
    name: Sync released version to main
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-version-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Commit the released version without downgrading main
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: node .github/scripts/sync-release-version.cjs "$RELEASE_TAG" "$RELEASE_SHA"
